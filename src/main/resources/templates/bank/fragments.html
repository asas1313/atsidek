<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="${title} + ' – Atsidėk'">Atsidėk</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav th:fragment="nav" class="bank-nav">
    <!-- PATVIRTINTAS meniu pergrupavimas (F3): "AI asistentas" pagrindiniame meniu (bendras įėjimo taškas,
         vėliau papildysimas ir taupymo tikslais), likę 4 IV/banko punktai + Nustatymai sugrupuoti po
         "Individualios veiklos mokesčiai" – vanilla <details>/<summary>, veikia kaip dropdown desktop'e
         ir accordion mobiliame, be JS. "Taupymo tikslai" - atskira plokščia nuoroda šalia grupės.
         Banko modulio grupė rodoma, kai NEprisijungęs (paspaudus - nukreipimas į Google, kaip ir
         anksčiau) ARBA kai ROLE_ADMIN; paprastam prisijungusiam (ROLE_USER-only) vartotojui ji
         paslepiama (PLAN.md §6 task 12) - apsauga pati (SecurityConfig, 403) nepasikeičia, tik nav. -->
    <a href="/">AI asistentas</a>
    <details class="nav-group" th:if="${!loggedIn or isAdmin}">
        <summary>Individualios veiklos mokesčiai</summary>
        <div class="nav-group-menu">
            <a href="/skaiciuokle">Skaičiuoklė</a>
            <a href="/importas">Įkelti išrašą</a>
            <a href="/suvestine">Suvestinė</a>
            <a href="/taisykles">Taisyklės</a>
            <a href="/nustatymai">Nustatymai</a>
        </div>
    </details>
    <a href="/taupymo-tikslai">Taupymo tikslai</a>
    <a th:if="${loggedIn}" href="/mano-tikslas">Mano tikslas</a>
    <a th:if="${loggedIn}" href="/paskyra">Mano paskyra</a>
    <div class="nav-auth">
        <a th:unless="${loggedIn}" href="/oauth2/authorization/google">Prisijungti</a>
        <form th:if="${loggedIn}" method="post" th:action="@{/logout}" style="display:inline"><button type="submit" class="link">Atsijungti</button></form>
    </div>
</nav>
<p th:fragment="build" class="build" th:attr="data-build=${buildSha}" th:text="${'Versija ' + appVersion}">Versija dev</p>
</body>
</html>
