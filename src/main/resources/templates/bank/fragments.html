<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="${title} + ' – Atsidėk'">Atsidėk</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav th:fragment="nav" class="bank-nav">
    <a th:unless="${loggedIn}" href="/oauth2/authorization/google">Prisijungti</a>
    <a href="/">Skaičiuoklė</a>
    <a th:if="${loggedIn}" href="/importas">Įkelti išrašą</a>
    <a th:if="${loggedIn}" href="/suvestine">Suvestinė</a>
    <a th:if="${loggedIn}" href="/taisykles">Taisyklės</a>
    <a th:if="${loggedIn}" href="/nustatymai">Nustatymai</a>
    <form th:if="${loggedIn}" method="post" th:action="@{/logout}" style="display:inline"><button type="submit" class="link">Atsijungti</button></form>
</nav>
</body>
</html>
