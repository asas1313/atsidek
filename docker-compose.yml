services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      ATSIDEK_CONTROLLER_NAME: ${CONTROLLER_NAME:?nurodyk CONTROLLER_NAME .env faile}
      ATSIDEK_CONTACT_EMAIL: ${CONTACT_EMAIL:?nurodyk CONTACT_EMAIL .env faile}
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
