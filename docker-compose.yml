services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_SHA: ${IMAGE_TAG:-local}
    image: atsidek:${IMAGE_TAG:-local}
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      ATSIDEK_CANONICAL_HOST: ${CANONICAL_HOST:-atsidek.eu}
      ATSIDEK_NOINDEX: ${NOINDEX:-false}
      ATSIDEK_CONTROLLER_NAME: ${CONTROLLER_NAME:?nurodyk CONTROLLER_NAME .env faile}
      ATSIDEK_CONTACT_EMAIL: ${CONTACT_EMAIL:?nurodyk CONTACT_EMAIL .env faile}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      ATSIDEK_AUTH_OWNER_EMAIL: ${AUTH_OWNER_EMAIL:-}
      ATSIDEK_AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      ATSIDEK_API_KEY_HASHES: ${API_KEY_HASHES:-}
      ATSIDEK_BANK_IBAN_SALT: ${BANK_IBAN_SALT:-dev-only-salt}
      # B1/ADR-0003: HMAC paslaptis AI pokalbio kontekstiniam žetonui - tuščia = fail closed (žetonų
      # neišduoda/nepriima, žr. ContextTokenService). Ši paslaptis egzistuoja TIK čia (app servise) -
      # Python assistant servisas žetono nei tikrina, nei dekoduoja, tik relėja jį nepakeistą, ir
      # šios paslapties NIEKADA neturi.
      ATSIDEK_CHAT_TOKEN_SECRET: ${CHAT_TOKEN_SECRET:-}
      ATSIDEK_ASSISTANT_BASE_URL: http://assistant:8000
      # Numatytosios reikšmės taiko TIK šio compose "postgres" servisą (žemiau) – tik lokaliam dev.
      # Staging/prod SPRING_DATASOURCE_* ateina iš deploy aplinkos (atskiras Postgres LXC 192.168.68.106),
      # šis compose servisas jų niekada nepaveikia.
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/atsidek}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-atsidek}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-atsidek}
    expose:
      - "8080"
    # Pagal nutylėjimą tik vietinis (127.0.0.1). Su Nginx Proxy Manager .env faile nurodyk APP_BIND=0.0.0.0
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"

  # PostgreSQL – TIK lokaliam dev (docker-compose). Staging ir production NIEKADA nenaudoja šio
  # serviso: ten jau veikia atskiras PostgreSQL atskirame LXC serveryje (192.168.68.106:5432,
  # duomenų bazės atsidek_staging / atsidek_prod), prisijungimas vyksta per SPRING_DATASOURCE_*
  # env kintamuosius, ateinančius iš deploy aplinkos (žr. DEPLOY.md). Šis servisas jų neliečia.
  #
  # Sąmoningai su atskiru profiliu "local-db" (NE numatytasis/be profilio, NE "caddy"/"tunnel"):
  # deploy.sh staging/production visada paleidžia su `--profile tunnel`, taigi be profilio
  # paliktas servisas būtų startavęs ir serveryje. Lokaliam dev paleisti:
  #   docker compose --profile local-db up -d --build
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-atsidek}
      POSTGRES_USER: ${DB_USER:-atsidek}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atsidek}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pagal nutylėjimą neskelbiamas į host'ą – prieinamas tik kitiems compose servisams tinkle.
    # Jei reikia prisijungti iš host'o (pvz. psql/DBeaver), atkomentuok:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-atsidek} -d ${DB_NAME:-atsidek}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # AI asistentas: atskiras Python servisas. Ištraukia skaičius iš teksto (Claude) ir kviečia app /api/v1/compare;
  # mokesčių pats neskaičiuoja. Aptarnauja tik POST "/asistentas" (rezultato fragmentas; puslapį rodo app) (maršrutas: Caddyfile / Cloudflare tunelis / NPM).
  assistant:
    build:
      context: ./assistant
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_SHA: ${IMAGE_TAG:-local}
    image: atsidek-assistant:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      ATSIDEK_API_URL: http://app:8080
      ATSIDEK_API_KEY: ${ATSIDEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-10}
      AI_DAILY_CAP: ${AI_DAILY_CAP:-300}
    expose:
      - "8000"
    ports:
      - "${APP_BIND:-127.0.0.1}:${ASSISTANT_PORT:-8000}:8000"

  # Variantas A (VPS su viešu IP): docker compose --profile caddy up -d --build
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - assistant
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Variantas B (namų serveris): docker compose --profile tunnel up -d --build
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - app
      - assistant
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  caddy_data:
  caddy_config:
  postgres_data:   # tik lokalaus dev "postgres" serviso duomenys
