services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_SHA: ${IMAGE_TAG:-local}
    image: atsidek:${IMAGE_TAG:-local}
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      ATSIDEK_CANONICAL_HOST: ${CANONICAL_HOST:-atsidek.eu}
      ATSIDEK_NOINDEX: ${NOINDEX:-false}
      ATSIDEK_CONTROLLER_NAME: ${CONTROLLER_NAME:?nurodyk CONTROLLER_NAME .env faile}
      ATSIDEK_CONTACT_EMAIL: ${CONTACT_EMAIL:?nurodyk CONTACT_EMAIL .env faile}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      ATSIDEK_AUTH_OWNER_EMAIL: ${AUTH_OWNER_EMAIL:-}
      ATSIDEK_AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      ATSIDEK_API_KEY_HASHES: ${API_KEY_HASHES:-}
      ATSIDEK_BANK_IBAN_SALT: ${BANK_IBAN_SALT:-dev-only-salt}
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:h2:file:/app/data/atsidek;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-sa}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
    expose:
      - "8080"
    # Pagal nutylėjimą tik vietinis (127.0.0.1). Su Nginx Proxy Manager .env faile nurodyk APP_BIND=0.0.0.0
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"

  # AI asistentas: atskiras Python servisas. Ištraukia skaičius iš teksto (Claude) ir kviečia app /api/v1/compare;
  # mokesčių pats neskaičiuoja. Aptarnauja "/" ir "/asistentas" (maršrutas: Caddyfile / Cloudflare tunelis / NPM).
  assistant:
    build:
      context: ./assistant
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_SHA: ${IMAGE_TAG:-local}
    image: atsidek-assistant:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      ATSIDEK_API_URL: http://app:8080
      ATSIDEK_NOINDEX: ${NOINDEX:-false}
      ATSIDEK_API_KEY: ${ATSIDEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-10}
      AI_DAILY_CAP: ${AI_DAILY_CAP:-300}
    expose:
      - "8000"
    ports:
      - "${APP_BIND:-127.0.0.1}:${ASSISTANT_PORT:-8000}:8000"

  # Variantas A (VPS su viešu IP): docker compose --profile caddy up -d --build
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - assistant
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Variantas B (namų serveris): docker compose --profile tunnel up -d --build
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - app
      - assistant
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  caddy_data:
  caddy_config:
