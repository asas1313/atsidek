name: CI ir diegimas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # rankinis production diegimas: Actions → Run workflow (šaka main)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp test

  # Diegimo darbai vyksta tik namų serveryje (self-hosted runner), niekada PR kodui.
  # Staging: automatiškai po merge į main. Production: tik rankiniu paleidimu.
  staging:
    if: github.event_name == 'push'
    needs: test
    runs-on: [self-hosted, atsidek]
    environment:
      name: staging
      url: https://staging.atsidek.eu
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/deploy.sh staging "${{ github.sha }}"

  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, atsidek]
    environment:
      name: production
      url: https://atsidek.eu
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/deploy.sh production "${{ github.sha }}"
