spring:
  config:
    import: optional:file:./.env[.properties]   # lokaliam paleidimui (docker-compose .env skaito pats)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email,profile
  datasource:
    # Produkcijoje/staging – tik per env (SPRING_DATASOURCE_URL/USERNAME/PASSWORD).
    # Numatytoji reikšmė – lokalus dev Postgres iš docker-compose.yml "postgres" serviso.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atsidek}
    username: ${SPRING_DATASOURCE_USERNAME:atsidek}
    password: ${SPRING_DATASOURCE_PASSWORD:atsidek}

atsidek:
  auth:
    owner-email: ""      # ATSIDEK_AUTH_OWNER_EMAIL – pirmą kartą prisijungęs perima senus „local“ duomenis
    allowed-emails: ""   # ATSIDEK_AUTH_ALLOWED_EMAILS – kableliais; tuščia = visi patvirtinti Google el. paštai
  api:
    key-hashes: ""       # ATSIDEK_API_KEY_HASHES – API raktų SHA-256 (hex), kableliais; tuščia = /api/** uždarytas
  bank:
    iban-salt: dev-only-salt # ATSIDEK_BANK_IBAN_SALT – mokėtojų IBAN maišos druska
  classifier:
    user-name: ""
    internal-keywords: ["savo saskaita", "pervedimas"]
    salary-keywords: ["darbo uzmokestis", "du", "atlyginimas", "salary"]
    personal-keywords: ["grazinimas", "refund", "dovana", "paskola"]
    institutions: ["vmi", "valstybine mokesciu inspekcija", "sodra", "valstybinio socialinio draudimo"]
    invoice-keywords: ["saskaita", "sf", "invoice", "pvm sf"]
    legal-forms: ["uab", "mb", "ab", "ii", "vsi", "ltd", "gmbh", "ou", "sia", "oy", "llc", "bv", "sp z o o"]
