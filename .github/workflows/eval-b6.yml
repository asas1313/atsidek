name: B6 agento eval (live, rankinis)

# Rankinis, kainuojantis AI-agento eval'as (B6, owner decision 3/15): paleidžiamas TIK per
# "Run workflow" (PASIRENKANT šaką feat/taupymas-agentas-b6 - žr. B6-live-eval-instrukcija.md),
# niekada automatiškai PR/push metu. Workflow pats pakelia tikrą Spring Boot (su
# SPRING_PROFILES_ACTIVE=eval-ci, kad /api/v1/eval/token - žr. src/main/java/eu/atsidek/evalci/ -
# egzistuotų logged_in FREE/PREMIUM atvejams) + PostgreSQL (service container) šiame runner'yje,
# tada paleidžia evals/agent/run_eval.py prieš juos. Reikalauja TIK ANTHROPIC_API_KEY secret - žr.
# docs/specs/taupymo-tikslai/B6-live-eval-instrukcija.md.
#
# ŠIS WORKFLOW FAILAS turi egzistuoti main šakoje, kad "Run workflow" jį rastų (GitHub reikalavimas
# workflow_dispatch'ui) - žr. atskirą, tik šį failą turinčią PR (B6 likęs kodas lieka tik
# feat/taupymas-agentas-b6 šakoje, dar nesujungtas).
on:
  workflow_dispatch:
    inputs:
      with_judge:
        description: "Taip pat kviesti DRAFT LLM-judge (claude-sonnet-5-5) - papildoma kaina, rubrika NEPATVIRTINTA"
        type: boolean
        default: false
      model:
        description: "Agento modelis"
        type: string
        default: "claude-haiku-5-5"

jobs:
  live-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atsidek
          POSTGRES_USER: atsidek
          POSTGRES_PASSWORD: atsidek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atsidek -d atsidek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant/requirements*.txt

      - name: Build app
        run: mvn -B -ntp -DskipTests package

      - name: Generate ephemeral secrets for this run (API key, chat-token secret)
        id: api_key
        run: |
          key="ci-eval-$(openssl rand -hex 24)"
          hash="$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)"
          token_secret="ci-eval-token-secret-$(openssl rand -hex 24)"
          echo "::add-mask::$key"
          echo "::add-mask::$token_secret"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "token_secret=$token_secret" >> "$GITHUB_OUTPUT"

      - name: Start Spring Boot in the background
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/atsidek
          SPRING_DATASOURCE_USERNAME: atsidek
          SPRING_DATASOURCE_PASSWORD: atsidek
          ATSIDEK_API_KEY_HASHES: ${{ steps.api_key.outputs.hash }}
          ATSIDEK_CHAT_TOKEN_SECRET: ${{ steps.api_key.outputs.token_secret }}
          # eval-ci profilis: aktyvuoja EvalTokenService/EvalTokenController (žr.
          # src/main/java/eu/atsidek/evalci/) - TIK šiam CI paleidimui, niekada staging/production.
          SPRING_PROFILES_ACTIVE: eval-ci
        run: |
          nohup java -jar target/*.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 || curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "App atsiliepė po ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "App neatsiliepė per 120s - log:"
          cat /tmp/app.log
          exit 1

      - name: Install assistant dependencies
        working-directory: assistant
        run: pip install -r requirements-dev.txt

      - name: Run live agent eval
        working-directory: assistant
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATSIDEK_API_URL: http://localhost:8080
          # Taip pat naudojamas /api/v1/eval/token mintimui logged_in (FREE/PREMIUM) atvejams -
          # žr. run_eval.py docstring "Context-token minting".
          ATSIDEK_API_KEY: ${{ steps.api_key.outputs.key }}
          AI_MODEL: ${{ inputs.model }}
        run: |
          args=(evals/agent/run_eval.py --model "$AI_MODEL")
          if [ "${{ inputs.with_judge }}" = "true" ]; then
            args+=(--with-judge)
          fi
          python "${args[@]}"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b6-eval-results
          path: assistant/evals/results/*.json
          retention-days: 30

      - name: Upload app log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: b6-eval-app-log
          path: /tmp/app.log
          retention-days: 7
